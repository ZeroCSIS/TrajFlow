# TIME-18 bounded 1,000-user engineering smoke. This is not a reported baseline result.
project:
  name: trajflow_yjmob100k_d1_smoke
  output_dir: ./outputs_yjmob_smoke
  seed: 42
  deterministic: true

data:
  dataset_type: open_source
  region: YJMob100K_D1_1k
  dataset_folder: data/processed/yjmob100k_d1_1k
  split_file: split_indices.npz
  sample_count: -1
  trajectory_length: 120
  batch_size: 256
  num_workers: 4
  parameterization_workers: 8
  parametrized: true
  parametrized_method: rdp_k
  parametrized_M: 10
  norm1by1: true
  od_finer: false
  geohash: false

flow_matching:
  enabled: true
  dropout_prob: 0.1
  flow_type: standard

ddpm:
  enabled: false
  beta_schedule: linear
  beta_start: 0.000001
  beta_end: 0.05
  num_diffusion_timesteps: 300
  ddim_steps: 300

condition:
  enabled: true
  condition_type: full
  transportation_mode: false
  embedding_type: wide_and_deep
  cfg_scale: 1

model:
  type: unet
  hidden_dim: 512

training:
  # Two epochs only verify the pipeline and measure throughput/memory.
  num_epochs: 2
  learning_rate: 0.0001
  print_every: 100
  save_every: 1
  # Keep only validation-selected best_model.pt and terminal last_model.pt.
  checkpoint_policy: best_and_last
  viz_bool: false
  use_validation: true
  validation_seed: 10042
  early_stop_patience: 10
  early_stop_delta: 0.000001
  device: cuda:0
  data_parallel: true

solver:
  method: euler
  step_size: 0.1

inference:
  num_samples: 200
  num_steps: 10
  sampling_method: em

evaluation:
  enabled: true
  max_curve_pairs: 200
  # The original 200x200 histogram is sampling-noise dominated at n=200.
  density_bins: 40
  # Drawn without overlap from the same held-out test split.
  real_control_samples: 200

visualization:
  num_samples: 200
  create_gif: false
  fps: 2
  norm1by12origialvis: true

unet:
  type: bayesian
  guidance_scale: 3
  in_channels: 2
  out_ch: 2
  ch: 128
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.1
  var_type: fixedlarge
  ema_rate: 0.9999
  ema: true
  resamp_with_conv: true
  grid_dim: 512

baseline:
  enabled: false
  type: markov
